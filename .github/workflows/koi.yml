name: Koi

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: yalongwastaken/git-koi@v1
        with:
          body: black
          output-dir: koi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow && python scripts/make_pond.py

      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif koi/koi_pond.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
